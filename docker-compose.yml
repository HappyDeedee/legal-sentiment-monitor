services:
  legal-sentiment-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: legal-sentiment-monitor:local
    container_name: legal-sentiment-monitor
    restart: unless-stopped
    env_file:
      - ./deploy/docker/monitor.env.example
      - path: ./deploy/docker/monitor.env
        required: false
    ports:
      - "${MONITOR_PORT:-8080}:8080"
    volumes:
      - ./deploy/docker/data:/app/monitor_data
      - ./deploy/docker/browser_data:/app/browser_data
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
